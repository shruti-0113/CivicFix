name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the Python sources
        run: python -m compileall -q app.py google_maps.py ai_assistant.py env_loader.py tests

      - name: Syntax-check the frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js

      - name: Run the API test suite
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to Render
    needs: test
    # The `vars` context is the only one allowed in `if`, so the gate uses a
    # repository variable. Without it the deploy job is skipped and CI stays green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_SERVICE_ID != ''
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy the main branch to Render
        uses: render-oss/render-deploy@v1
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        with:
          serviceId: ${{ vars.RENDER_SERVICE_ID }}
